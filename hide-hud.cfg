// ============================================================
//  CS2 HUD - hide the on-screen HUD
// ============================================================
//  Your HP / ammo / money / score are on the glasses now, so you
//  can hide CS2's on-screen HUD. Copy this file into your CS2 cfg
//  folder (next to gamestate_integration_glasses.cfg), then in the
//  console type:   exec hide-hud
//
//  Pick ONE option below (Option A is active by default; to use
//  Option B, comment out A's two lines and uncomment B's line).
//
//  Heads-up: these are gated by sv_cheats, so they apply on
//  practice / offline-with-bots / community servers. Official
//  matchmaking may keep the on-screen HUD on. Hiding your own HUD
//  is a visual preference, not a cheat - Valve just gates it.
// ============================================================

sv_cheats 1

// ---- OPTION A: hide the HUD but KEEP the radar/minimap ----
cl_drawhud_force_radar 1
cl_drawhud 0

// ---- OPTION B: disable the ENTIRE HUD, kill feed only (no radar) ----
// Comment out Option A's two lines above, then uncomment this:
// cl_draw_only_deathnotices 1

// Toggle the HUD back on/off with P (change the key if it clashes).
// Option A restores with cl_drawhud 1; Option B with cl_draw_only_deathnotices 0.
bind "p" "toggle cl_drawhud 0 1"

echo "CS2 HUD: on-screen HUD hidden. Press P to toggle, or restore with cl_drawhud 1 / cl_draw_only_deathnotices 0."
