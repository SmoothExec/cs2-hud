// ============================================================
//  CS2 HUD - hide the on-screen HUD, keep the radar
// ============================================================
//  Your HP / ammo / money / score now live on the glasses, so
//  you can hide CS2's on-screen HUD and keep only the radar.
//
//  HOW: copy this file into your CS2 cfg folder (next to the
//  gamestate_integration_glasses.cfg), then in the console type:
//      exec hide-hud
//
//  IMPORTANT: cl_drawhud is locked behind sv_cheats by Valve.
//  So this works in PRACTICE / offline-with-bots / community
//  servers that allow cheats. It does NOT work in official
//  matchmaking (Premier / Competitive / Casual) - there the
//  HUD stays on screen. Hiding your own HUD is a visual
//  preference, not a cheat; Valve just gates the command.
// ============================================================

sv_cheats 1
cl_drawhud_force_radar 1
cl_drawhud 0

// ALTERNATIVE: want only the kill feed and NO radar? Comment out the two
// lines above and uncomment this instead. (cl_draw_only_deathnotices is
// also sv_cheats-locked, so the same practice-only limit applies.)
// cl_draw_only_deathnotices 1

// Toggle the HUD on/off with P (change the key if it clashes).
bind "p" "toggle cl_drawhud 0 1"

echo "CS2 HUD: on-screen HUD hidden, radar kept. Press P to toggle, or 'cl_drawhud 1' to restore."
